name: Sync to Hugging Face Spaces

on:
  workflow_dispatch:

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME || 'janeconverter-web' }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git config --global user.email "bot@janeconverter.local"
            git config --global user.name "JaneConverter CI"
            git remote add hf "https://user:$HF_TOKEN@huggingface.co/spaces/${{ secrets.HF_USERNAME || github.repository_owner }}/$HF_SPACE_NAME"
            git push --force hf main
          else
            echo "HF_TOKEN not set, skipping sync."
          fi
